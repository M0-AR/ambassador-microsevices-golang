services:
  checkout_backend:
    build:
      context: .
      dockerfile: prod.dockerfile
    image: ${CHECKOUT_IMAGE:-ambassador-checkout:local}
    command: ["/app/service"]
    restart: unless-stopped
    ports:
      - "8004:8000"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-checkout}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      USERS_MS: ${USERS_MS:-http://users-ms:8000}
      STRIPE_KEY: ${STRIPE_KEY}
      CHECKOUT_URL: ${CHECKOUT_URL:-http://localhost:5000}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
    networks:
      - ambassador

  checkout_queue:
    build:
      context: .
      dockerfile: prod.dockerfile
    image: ${CHECKOUT_IMAGE:-ambassador-checkout:local}
    command: ["/app/consumer"]
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-checkout}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      USERS_MS: ${USERS_MS:-http://users-ms:8000}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_GROUP_ID: checkout-consumer
    networks:
      - ambassador

networks:
  ambassador:
    external: true
    name: ambassador
