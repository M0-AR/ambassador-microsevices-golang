apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: ambassador-backend
  name: ambassador-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: ambassador-backend
  template:
    metadata:
      labels:
        io.kompose.service: ambassador-backend
    spec:
      containers:
        - args:
            - go
            - run
            - main.go
          env:
            - name: DB_DATABASE
              value: ambassador
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: ambassador-config
                  key: DB_HOST
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ambassador-secrets
                  key: DB_PASSWORD
            - name: DB_PORT
              value: "3306"
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: ambassador-config
                  key: DB_USERNAME
            - name: USERS_MS
              value: http://users-ms:8000
          image: ghcr.io/m0-ar/ambassador-ambassador:1.0.0
          name: ambassador-backend
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: ambassador-queue
  name: ambassador-queue
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: ambassador-queue
  template:
    metadata:
      labels:
        io.kompose.service: ambassador-queue
    spec:
      containers:
        - args:
            - go
            - run
            - ./src/commands/consumer
          env:
            - name: DB_DATABASE
              value: ambassador
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: ambassador-config
                  key: DB_HOST
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ambassador-secrets
                  key: DB_PASSWORD
            - name: DB_PORT
              value: "3306"
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: ambassador-config
                  key: DB_USERNAME
            - name: USERS_MS
              value: http://users-ms:8000
          image: ghcr.io/m0-ar/ambassador-ambassador:1.0.0
          name: ambassador-queue
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: ambassador-backend
  name: ambassador-backend
spec:
  ports:
    - name: "8003"
      port: 8003
      targetPort: 8000
  selector:
    io.kompose.service: ambassador-backend