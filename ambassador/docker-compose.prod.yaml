services:
  ambassador_backend:
    build:
      context: .
      dockerfile: prod.dockerfile
    image: ${AMBASSADOR_IMAGE:-ambassador-ambassador:local}
    command: ["/app/service"]
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-ambassador}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      USERS_MS: ${USERS_MS:-http://users-ms:8000}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
    networks:
      - ambassador

  ambassador_queue:
    build:
      context: .
      dockerfile: prod.dockerfile
    image: ${AMBASSADOR_IMAGE:-ambassador-ambassador:local}
    command: ["/app/consumer"]
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-ambassador}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      USERS_MS: ${USERS_MS:-http://users-ms:8000}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_GROUP_ID: ambassador-consumer
    networks:
      - ambassador

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      ambassador:
        aliases:
          - redis

networks:
  ambassador:
    external: true
    name: ambassador
