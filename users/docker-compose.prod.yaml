services:
  users_backend:
    build:
      context: .
      dockerfile: prod.dockerfile
    image: ${USERS_IMAGE:-ambassador-users:local}
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-users}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      ambassador:
        aliases:
          - users-ms

networks:
  ambassador:
    external: true
    name: ambassador
